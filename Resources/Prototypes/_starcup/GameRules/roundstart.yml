# Antags
- type: entity
  parent: BaseGameRule
  id: TraitorRandom
  components:
  - type: DynamicRule
    startingBudgetMin: 100
    startingBudgetMax: 100
    table: !type:AllSelector
      children:
      - !type:GroupSelector
        conditions:
        - !type:RoundDurationCondition
          max: 1
        children:
        - id: TraitorNT
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition
        - id: TraitorSyndie
          conditions:
          - !type:HasBudgetCondition
          - !type:MaxRuleOccurenceCondition

- type: entity
  parent: BaseTraitorRule
  id: TraitorNT
  components:
  - type: GameRule
    minPlayers: 5
    delay:
      min: 240
      max: 420
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ TraitorNT ]
      max: 8
      playerRatio: 10
      blacklist:
        components:
        - AntagImmune
      lateJoinAdditional: false
      mindRoles:
      - MindRoleTraitorNT

- type: entity
  id: TraitorReinforcementNT
  parent: BaseTraitorRule
  components:
  - type: TraitorRule
    giveUplink: false
    giveCodewords: false # It would actually give them a different set of codewords than the regular traitors, anyway
    giveBriefing: false
  - type: AntagSelection
    definitions:
    - prefRoles: [ TraitorNT ]
      mindRoles:
      - MindRoleTraitorReinforcementNT

# Basic Schedulers

- type: entity
  id: CalmStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1200 # 20 min
    minMaxEventTiming:
      min: 1950 # 32.5 min
      max: 2250 # 37.5 min
    scheduledGameRules: !type:NestedSelector
      tableId: CalmGameRulesTable

- type: entity
  id: TroubleStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1200 # 20 min
    minMaxEventTiming:
      min: 1650 # 27.5 min
      max: 1950 # 32.5 min
    scheduledGameRules: !type:NestedSelector
      tableId: TroubleGameRulesTable

- type: entity
  id: DangerStationEventScheduler
  parent: BaseGameRule
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: DangerGameRulesTable

# event schedulers

- type: entityTable
  id: CalmGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: StarcupCalmEventsTable
      - !type:NestedSelector
        tableId: CalmCritterEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable

- type: entityTable
  id: TroubleGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: StarcupCalmEventsTable
      - !type:NestedSelector
        tableId: CalmCritterEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: StarcupDangerEventsTable
      - !type:NestedSelector
        tableId: HostileCritterEventsTable

- type: entityTable
  id: DangerGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: StarcupCalmEventsTable
      - !type:NestedSelector
        tableId: CalmCritterEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: StarcupDangerEventsTable
      - !type:NestedSelector
        tableId: HostileCritterEventsTable
      - !type:NestedSelector
        tableId: StarcupAntagEventsTable
