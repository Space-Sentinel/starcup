- type: entityTable
  id: StarcupCalmEventsTable # these are the ones that almost certainly can't kill you
  table: !type:AllSelector
    children:
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: KudzuGrowth
    - id: IonStorm
    - id: MassHallucinations
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SolarFlare
    - id: VentClog

- type: entityTable
  id: StarcupDangerEventsTable # these are the ones that can probably kill you
  table: !type:AllSelector
    children:
    - id: AnomalySpawn
    - id: GasLeak
    - id: GreytideVirus
    - !type:NestedSelector
      tableId: DerelictBorgEventTableNoAssault

- type: entityTable
  id: StarcupAntagEventsTable
  table: !type:AllSelector
    children:
    - id: ClosetSkeleton
    - id: DragonSpawn
    - id: KingRatMigration
    - id: ParadoxCloneSpawn
    - id: SleeperAgents
    - id: SleeperAgentsNT
    - !type:NestedSelector
      tableId: DerelictBorgEventTable

- type: entityTable
  id: DerelictBorgEventTableNoAssault
  table: !type:GroupSelector
    children:
    - !type:GroupSelector
      children:
        - id: DerelictEngineerCyborgSpawn
        - id: DerelictGenericCyborgSpawn
        - id: DerelictJanitorCyborgSpawn
        - id: DerelictMedicalCyborgSpawn
        - id: DerelictMiningCyborgSpawn

- type: entity
  parent: BaseTraitorRule
  id: SleeperAgentsNT
  components:
  - type: StationEvent
    earliestStart: 30
    weight: 6
    minimumPlayers: 20
    maxOccurrences: 1 # can only happen once per round
    startAnnouncement: station-event-communication-interception
    startAudio:
      path: /Audio/Announcements/intercept.ogg
    duration: null # the rule has to last the whole round not 1 second
    occursDuringRoundEnd: false
  - type: AlertLevelInterceptionRule
  - type: AntagSelection
    definitions:
    - prefRoles: [ TraitorSleeperNT ]
      fallbackRoles: [ TraitorNT ]
      min: 1
      max: 1 # only 1 since there are two different sleeper events
      playerRatio: 10
      blacklist:
        components:
        - AntagImmune
      mindRoles:
      - MindRoleTraitorSleeperNT
