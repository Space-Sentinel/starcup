- type: reagent
  id: Appletini
  name: reagent-name-appletini
  parent: BaseAlcohol
  desc: reagent-desc-appletini
  physicalDesc: reagent-physical-desc-citric
  flavor: appletini
  color: "#a6f037"
  metamorphicSprite:
    sprite: _starcup/Objects/Consumable/Drinks/appletini.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 3
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: true
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 2
      - !type:AdjustReagent
        reagent: Ethanol
        amount: 0.13

