- type: biomeTemplate
  id: CharonEpsilon
  layers:
  # Sparse vegetation
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    divisions: 2
    threshold: -0.50
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 1
    decals:
    - grasssnowa1
    - grasssnowa2
    - grasssnowa3
    - grasssnowb1
    - grasssnowb2
    - grasssnowb3
    - grasssnowc1
    - grasssnowc2
    - grasssnowc3
  # Dense, bland grass
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorSnow
    divisions: 1
    threshold: -0.35
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.2
      fractalType: FBm
      octaves: 5
      lacunarity: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    decals:
    - grasssnow
    - grasssnow01
    - grasssnow02
    - grasssnow03
    - grasssnow04
    - grasssnow05
    - grasssnow06
    - grasssnow07
    - grasssnow08
    - grasssnow09
    - grasssnow10
    - grasssnow11
    - grasssnow12
    - grasssnow13
  - !type:BiomeEntityLayer
    threshold: 0.5
    noise:
      seed: 0
      noiseType: OpenSimplex2
      fractalType: FBm
      frequency: 2
    allowedTiles:
    - FloorPlanetDirtTwilight
    entities:
    - FloraTreeDead
  - !type:BiomeEntityLayer
    threshold: 0.5
    noise:
      seed: 0
      noiseType: OpenSimplex2
      fractalType: FBm
      frequency: 2
    allowedTiles:
    - FloorPlanetGrassBlue
    entities:
    - FloraTreeLargeDark
  # Dirt tiles
  - !type:BiomeTileLayer
    tile: FloorPlanetDirtTwilight
    threshold: -0.9
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.03
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
  # Grass tiles
  - !type:BiomeTileLayer
    tile: FloorPlanetGrassBlue
    threshold: -0.9
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.03
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
  # Liquid plasma rivers. Ice moon baby
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorPlanetDirtTwilight
    - FloorPlanetGrassBlue
    threshold: 0.95
    noise:
      seed: 3
      noiseType: OpenSimplex2
      frequency: 0.003
      lacunarity: 1.50
      fractalType: Ridged
      octaves: 1
    entities:
    - FloorMuteWaterEntity
  - !type:BiomeDummyLayer
    id: Loot
