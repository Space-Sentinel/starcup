- type: entity
  name: laser sharkminnow
  parent: MobShark
  id: MobSharkLaser
  description: The execution method of choice for the sophisticated space villain.
  components:
    - type: Sprite
      sprite: _starcup/Mobs/Aliens/Carps/Sharkminnows/sharkminnowlaser.rsi
      layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: alive
      - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
        state: mouth
        shader: unshaded
    - type: HitscanBatteryAmmoProvider
      proto: RedLightLaser
      fireCost: 50
    - type: BatterySelfRecharger
      autoRecharge: true
      autoRechargeRate: 50
    - type: Battery
      maxCharge: 1000
      startingCharge: 1000
    - type: Gun
      fireRate: 1
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_cannon.oggç

- type: entity
  name: shelled sharkminnow
  parent: MobShark
  id: MobSharkShelled
  description: A dangerous shark from the blackness of endless space, protected by thick bony plates.
  components:
    - type: Sprite
      sprite: _starcup/Mobs/Aliens/Carps/Sharkminnows/sharkminnowshelled.rsi
      layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: alive
      - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
        state: mouth
        shader: unshaded
    - type: MobThresholds
      thresholds:
        0: Alive
        185: Dead

