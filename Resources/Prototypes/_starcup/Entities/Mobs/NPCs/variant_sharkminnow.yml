- type: entity
  name: sharkminnow blue
  parent: MobShark
  id: MobSharkBlue
  description: A dangerous shark from the blackness of endless space, who loves to drink blood.
  components:
    - type: Sprite
      sprite: _starcup/Mobs/Aliens/Carps/Sharkminnows/sharkminnowblue.rsi
      layers:
      - map: [ "enum.DamageStateVisualLayers.Base" ]
        state: alive
      - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
        state: mouth
        shader: unshaded

