- type: entity
  name: old fashioned glass
  description: For stronger, meaner drinks. Holds up to 20 units.
  parent: DrinkGlassBase
  id: DrinkGlassOldFashioned
  components:
  - type: Sprite
    sprite: _starcup/Objects/Consumable/Drinks/glass_oldfashioned.rsi
    layers:
      - state: icon
        map: [ "enum.SolutionContainerLayers.Base" ]
      - state: fill1
        map: [ "enum.SolutionContainerLayers.Fill" ]
        visible: false
      - state: icon-front
        map: [ "enum.SolutionContainerLayers.Overlay" ]
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 20
  - type: SolutionContainerVisuals
    maxFillLevels: 6
    fillBaseName: fill

- type: entity
  name: cocktail glass
  description: For drinks meant to be slowly savored. Holds up to 15 units.
  parent: DrinkGlassBase
  id: DrinkGlassCocktail
  components:
  - type: Sprite
    sprite: _starcup/Objects/Consumable/Drinks/glass_cocktail.rsi
    layers:
      - state: icon
        map: [ "enum.SolutionContainerLayers.Base" ]
      - state: fill1
        map: [ "enum.SolutionContainerLayers.Fill" ]
        visible: false
      - state: icon-front
        map: [ "enum.SolutionContainerLayers.Overlay" ]
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill

- type: entity
  name: highball glass
  description: For light drinks and having a good time. Holds up to 30 units.
  parent: DrinkGlassBase
  id: DrinkGlassHighball
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/glass_clear.rsi
    layers:
      - state: icon
        map: [ "enum.SolutionContainerLayers.Base" ]
      - state: fill1
        map: [ "enum.SolutionContainerLayers.Fill" ]
        visible: false
      - state: icon-front
        map: [ "enum.SolutionContainerLayers.Overlay" ]
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
  - type: SolutionContainerVisuals
    maxFillLevels: 9
    fillBaseName: fill

